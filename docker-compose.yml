services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    networks:
      - app-network

  backend-nginx:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - .:/var/www
      - ./nginx/backend-nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

networks:
  app-network:
    external: true